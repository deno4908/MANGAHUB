<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-labelledby="title desc">
  <title id="title">MANGAHUB No Cover</title>
  <desc id="desc">Minimal placeholder image shown when manga cover is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ed"/>
      <stop offset="100%" stop-color="#efe8dc"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#bg)"/>

  <rect x="24" y="24" width="252" height="402" rx="14" fill="#fcfaf5" stroke="#d8cfbf" stroke-width="2"/>
  <rect x="24" y="24" width="252" height="40" rx="14" fill="#f1ebe0"/>
  <rect x="24" y="58" width="252" height="1" fill="#ded5c7"/>
  <rect x="40" y="36" width="8" height="8" rx="2" fill="#dc2626"/>
  <text x="56" y="44" fill="#3f3b34" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MANGAHUB</text>

  <g transform="translate(75 120)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#f6f2e9" stroke="#cfc5b4" stroke-width="2"/>
    <g fill="none" stroke="#7b7467" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="26" width="94" height="64" rx="8"/>
      <path d="M34 92l22-18 20 14 16-12 26 20"/>
      <circle cx="70" cy="52" r="8"/>
    </g>
  </g>

  <text x="150" y="315" text-anchor="middle" fill="#3f3b34" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1">MANGAHUB</text>
  <text x="150" y="342" text-anchor="middle" fill="#6f675a" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.4">NO COVER</text>
  <text x="150" y="365" text-anchor="middle" fill="#8e8578" font-family="Segoe UI, Arial, sans-serif" font-size="12">Chưa có ảnh bìa</text>
</svg>
