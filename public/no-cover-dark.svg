<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-labelledby="title desc">
  <title id="title">MANGAHUB No Cover Dark</title>
  <desc id="desc">Minimal dark placeholder image shown when manga cover is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151a23"/>
      <stop offset="100%" stop-color="#0f131b"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#bg)"/>

  <rect x="24" y="24" width="252" height="402" rx="14" fill="#1d2430" stroke="#374151" stroke-width="2"/>
  <rect x="24" y="24" width="252" height="40" rx="14" fill="#161c27"/>
  <rect x="24" y="58" width="252" height="1" fill="#303948"/>
  <rect x="40" y="36" width="8" height="8" rx="2" fill="#ef4444"/>
  <text x="56" y="44" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MANGAHUB</text>

  <g transform="translate(75 120)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#171d28" stroke="#4b5563" stroke-width="2"/>
    <g fill="none" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="26" width="94" height="64" rx="8"/>
      <path d="M34 92l22-18 20 14 16-12 26 20"/>
      <circle cx="70" cy="52" r="8"/>
    </g>
  </g>

  <text x="150" y="315" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1">MANGAHUB</text>
  <text x="150" y="342" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.4">NO COVER</text>
  <text x="150" y="365" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">Chưa có ảnh bìa</text>
</svg>
