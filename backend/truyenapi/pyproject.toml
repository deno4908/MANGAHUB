[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truyenapi"
version = "0.7.0"
description = "Live TruyenQQ API without a database"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[http2]>=0.28,<1", "beautifulsoup4>=4.12,<5", "lxml>=6,<7", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
truyenapi = "truyenapi.cli:main"

[tool.setuptools.packages.find]
include = ["truyenapi*"]

[tool.setuptools.package-data]
truyenapi = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
