name: Deploy standby source relay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source access and request boundaries
        run: node --test cloudflare/truyenqq-edge.test.mjs
      - name: Deploy separate standby source relay
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler-source-standby.toml
