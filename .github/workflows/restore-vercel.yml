name: Restore Vercel serving path
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original route ownership
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          def api(path, data=None, method='GET'):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              assert value['success']
              return value['result']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          scripts = {script['id'] for script in api('accounts/' + account + '/workers/scripts')}
          assert 'mangahub-vn-only' in scripts, 'Original country guard must exist before changing routes'
          zone = api('zones?name=mangahub.art')[0]['id']
          routes = api('zones/' + zone + '/workers/routes')
          frontend = 'mangahub.art/*'
          service_routes = {'api.mangahub.art/*', 'auth.mangahub.art/*'}
          for route in routes:
              if route['pattern'] == frontend:
                  assert route.get('script') in {'mangahub-vn-only', 'mangahub-standby-router'}
              if route['pattern'] in service_routes:
                  assert route.get('script') in {None, 'mangahub-standby-router'}, 'Unexpected route owner'
          Path('/tmp/mh-restore-routes.json').write_text(json.dumps({'zone':zone,'routes':routes}))
          route = next((r for r in routes if r['pattern'] == frontend), None)
          if route:
              if route.get('script') != 'mangahub-vn-only':
                  api('zones/' + zone + '/workers/routes/' + route['id'], {'pattern':frontend,'script':'mangahub-vn-only'}, 'PUT')
          else:
              api('zones/' + zone + '/workers/routes', {'pattern':frontend,'script':'mangahub-vn-only'}, 'POST')
          for route in routes:
              if route['pattern'] in service_routes and route.get('script') == 'mangahub-standby-router':
                  api('zones/' + zone + '/workers/routes/' + route['id'], method='DELETE')
          print('Frontend restored to original country guard; API/auth detached from standby router')
          PY
      - name: Restore source relay without standby service binding
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
      - name: Disable standby drills, activation and schedules
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          p = Path('cloudflare/wrangler-standby.toml')
          text = p.read_text().replace('crons = ["* * * * *"]', 'crons = []')
          settings = tomllib.loads(text)
          assert settings['routes'] == []
          assert settings['vars']['FAILOVER_ENABLED'] == 'false'
          assert settings['vars']['MONITOR_ONLY'] == 'false'
          assert settings['vars']['DRILL_CLIENT_IP'] == ''
          assert settings['vars']['DRILL_EXPIRES_AT'] == '0'
          assert settings['triggers']['crons'] == []
          p.write_text(text)
          PY
          npx --yes wrangler@4 deploy --config cloudflare/wrangler-standby.toml
      - name: Verify restored routes and restore API/auth DNS proxy state if permitted
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          def api(path, data=None, method='GET'):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              assert value['success']
              return value['result']
          previous = json.loads(Path('/tmp/mh-restore-routes.json').read_text())
          zone = previous['zone']
          current = {r['pattern']:r.get('script') for r in api('zones/' + zone + '/workers/routes')}
          targets = {'mangahub.art/*','api.mangahub.art/*','auth.mangahub.art/*'}
          assert current.get('mangahub.art/*') == 'mangahub-vn-only'
          assert not any(script == 'mangahub-standby-router' for script in current.values())
          for route in previous['routes']:
              if route['pattern'] not in targets:
                  assert current.get(route['pattern']) == route.get('script'), 'Unrelated source route changed'
          assert current.get('mangahub.art/api/mangadex-edge/*') == 'mangahub-mangadex-edge'
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          settings = api('accounts/' + account + '/workers/scripts/mangahub-standby-router/settings')
          bindings = {b['name']:b for b in settings['bindings']}
          assert bindings['FAILOVER_ENABLED']['text'] == 'false'
          assert bindings['MONITOR_ONLY']['text'] == 'false'
          assert bindings['DRILL_CLIENT_IP']['text'] == ''
          schedules = api('accounts/' + account + '/workers/scripts/mangahub-standby-router/schedules')
          assert not schedules['schedules']
          source = api('accounts/' + account + '/workers/scripts/mangahub-mangadex-edge/settings')
          assert not any(b.get('service') == 'mangahub-standby-router' for b in source['bindings'])
          print(json.dumps({'routes_restored':True,'source_relay_independent_of_standby':True,'standby_schedule_removed':True}))
          for name in ['api.mangahub.art','auth.mangahub.art']:
              try:
                  records = api('zones/' + zone + '/dns_records?name=' + name)
                  assert len(records) == 1 and records[0]['type'] == 'CNAME', 'Verify existing Vercel CNAME before editing'
                  record = records[0]
                  target = record['content'].rstrip('.').lower()
                  assert target.endswith('.vercel.app') or re.search(r'\.vercel-dns(?:-[a-z0-9-]+)?\.com$', target), 'Unexpected origin; left unchanged'
                  if record['proxied']:
                      api('zones/' + zone + '/dns_records/' + record['id'], {'proxied':False}, 'PATCH')
                  check = api('zones/' + zone + '/dns_records/' + record['id'])
                  assert check['proxied'] is False and check['content'] == record['content']
                  print(json.dumps({'dns_name':name,'dns_only':True,'vercel_target_preserved':True}))
              except urllib.error.HTTPError as error:
                  if error.code != 403:
                      raise
                  print(json.dumps({'dns_name':name,'manual_dns_change_required':True,'cloudflare_api_status':403}))
          PY
