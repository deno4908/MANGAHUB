name: Manage adaptive standby router
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, prepare, activate, update, rollback, quota-relief]
        default: inspect
        required: true
      country_guard_confirmed:
        type: boolean
        default: false
        description: Exact independent country rule was deployed manually after Rulesets API denial
permissions:
  contents: read
concurrency:
  group: adaptive-standby-router
  cancel-in-progress: false
jobs:
  manage:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STANDBY_ORIGIN_SECRET: ${{ secrets.STANDBY_ORIGIN_SECRET }}
      OPERATION: ${{ inputs.operation }}
      COUNTRY_GUARD_CONFIRMED: ${{ inputs.country_guard_confirmed }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cloudflare
            deploy/standby
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test routing and source access
        run: |
          node --test cloudflare/standby-worker.test.mjs cloudflare/truyenqq-edge.test.mjs
          python3 -m unittest discover -s cloudflare -p 'test_*.py'
      - name: Inspect public routing without disclosing origin addresses
        run: python3 cloudflare/manage-standby.py inspect
      - name: Read aggregate traffic without changing production
        if: inputs.operation == 'inspect'
        run: python3 cloudflare/traffic-audit.py
      - name: Observe aggregate paths for 90 seconds
        if: inputs.operation == 'inspect'
        run: node cloudflare/traffic-tail.mjs
      - name: Prepare router configuration
        if: inputs.operation == 'prepare' || inputs.operation == 'activate' || inputs.operation == 'update'
        run: |
          test -n "$STANDBY_ORIGIN_SECRET"
          umask 077
          router_mode="$OPERATION"
          if [ "$router_mode" = update ]; then router_mode=activate; fi
          python3 cloudflare/manage-standby.py "config-$router_mode"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('/tmp/mh-standby-secret.json').write_text(json.dumps({'STANDBY_ORIGIN_SECRET':os.environ['STANDBY_ORIGIN_SECRET']}))
          PY
          npx --yes wrangler@4 secret bulk /tmp/mh-standby-secret.json --config cloudflare/standby-runtime.toml
          npx --yes wrangler@4 deploy --config cloudflare/standby-runtime.toml
          python3 cloudflare/manage-standby.py restore-failure-policy
          python3 cloudflare/manage-standby.py probe
      - name: Verify standby during a primary provider incident
        if: inputs.operation == 'update'
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          import importlib.util
          spec=importlib.util.spec_from_file_location('standby_manager','cloudflare/manage-standby.py')
          manager=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(manager)
          settings=manager.api('accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/mangahub-standby-router/settings')
          override=next((b.get('text') for b in settings.get('bindings',[]) if b.get('name')=='PRIMARY_RESOLVE_OVERRIDE'),None)
          assert override=='primary-origin.mangahub.art','Primary ingress alias was not deployed'
          print(json.dumps({'primary_override_verified':True}))
          base='https://standby.mangahub.art/internal/router-probe'
          for query in ['kind=daily-health','kind=readiness','kind=frontend&target=backup','kind=api&target=backup','kind=auth&target=backup']:
              request=urllib.request.Request(base+'?'+query,headers={'X-MangaHub-Probe-Secret':os.environ['STANDBY_ORIGIN_SECRET'],'User-Agent':'MangaHub-Standby-Operator/1.0'})
              for attempt in range(3):
                  with urllib.request.urlopen(request,timeout=20) as response: result=json.load(response)
                  valid=result.get('initialized') and result.get('shared') if query=='kind=daily-health' else result.get('ok') if query=='kind=readiness' else result.get('status')==200
                  if valid:break
                  if attempt<2:time.sleep(1)
              print(json.dumps({'probe':query,'healthy':bool(valid)}))
              assert valid,'Standby verification failed'
          PY
      - name: Check actual standby dependencies and both origins
        if: inputs.operation == 'prepare' || inputs.operation == 'activate'
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          base='https://standby.mangahub.art/internal/router-probe'
          for query in ['kind=daily-health','kind=readiness','kind=frontend&target=primary','kind=frontend&target=backup','kind=api&target=primary','kind=api&target=backup','kind=auth&target=primary','kind=auth&target=backup','kind=drill']:
              request=urllib.request.Request(base+'?'+query,headers={'X-MangaHub-Probe-Secret':os.environ['STANDBY_ORIGIN_SECRET'],'User-Agent':'MangaHub-Standby-Operator/1.0'})
              result={'status':'unreachable'}
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:result=json.load(response)
                      valid=result.get('initialized') and result.get('shared') if query=='kind=daily-health' else result.get('ok') if query=='kind=readiness' else result.get('recovered') if query=='kind=drill' else result.get('status')==200
                      if valid:break
                  except (OSError,ValueError):valid=False
                  if attempt<4:time.sleep(5)
              print(json.dumps({'probe':query,'result':result}))
              assert valid,'Origin verification failed: '+query
          PY
      - name: Activate verified routes
        if: inputs.operation == 'activate'
        run: python3 cloudflare/manage-standby.py activate
      - name: Restore original country Worker and Vercel routing
        if: inputs.operation == 'rollback'
        run: python3 cloudflare/manage-standby.py rollback
      - name: Reduce free-plan traffic after origin image preflight
        if: inputs.operation == 'quota-relief'
        run: python3 cloudflare/quota-routes.py
