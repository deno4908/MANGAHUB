name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy-mangadex-edge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy MangaDex edge worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler@4 deploy --config cloudflare/wrangler.toml

  deploy:
    # This is the old deploy-user host, not the native standby service.
    # Keep it opt-in so an unconfigured legacy target cannot fail production CI.
    if: vars.LEGACY_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            /opt/mangahub/deploy.sh
