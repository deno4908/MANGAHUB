name: Deploy standby router
on:
  workflow_dispatch:
    inputs:
      activate:
        description: "Attach the three public routes after the standby drill passes"
        type: boolean
        default: false
      drill_client_ip:
        description: "Optional public client IP for a one-hour VPS drill; other readers stay on Vercel"
        type: string
        default: ""
      inspect_only:
        description: "Inspect routing and API challenge configuration without deploying"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STANDBY_ORIGIN_SECRET: ${{ secrets.STANDBY_ORIGIN_SECRET }}
      ACTIVATE: ${{ inputs.activate }}
      DRILL_CLIENT_IP: ${{ inputs.drill_client_ip }}
      INSPECT_ONLY: ${{ inputs.inspect_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify routing behavior
        run: node --test cloudflare/standby-worker.test.mjs
      - name: Inspect existing route ownership
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          def get(path):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              assert value['success']
              return value['result']
          zone = get('zones?name=mangahub.art')[0]['id']
          print(json.dumps([{'pattern': route['pattern'], 'script': route.get('script')}
              for route in get('zones/' + zone + '/workers/routes')]))
          if os.environ.get('INSPECT_ONLY') == 'true':
              for label, path in [('security_level', 'settings/security_level'), ('configuration_rules', 'rulesets/phases/http_config_settings/entrypoint')]:
                  try:
                      result = get('zones/' + zone + '/' + path)
                      if label == 'security_level':
                          print(json.dumps({'setting': label, 'value': result.get('value')}))
                      else:
                          print(json.dumps({'setting': label, 'rules': [
                              {key: rule.get(key) for key in ['id', 'ref', 'expression', 'enabled', 'action', 'action_parameters']}
                              for rule in result.get('rules', [])]}))
                  except urllib.error.HTTPError as error:
                      print(json.dumps({'setting': label, 'http_status': error.code}))
          PY
      - name: Check standby readiness before activation
        if: '!inputs.inspect_only && (inputs.activate || inputs.drill_client_ip != '''')'
        run: |
          python3 - <<'PY'
          import ipaddress, json, os, urllib.request
          drill_ip = os.environ.get('DRILL_CLIENT_IP', '').strip()
          if drill_ip:
              assert ipaddress.ip_address(drill_ip).is_global, 'Drill requires a public IP'
              assert os.environ['ACTIVATE'] != 'true', 'Use a drill before full activation'
          path = 'standby-drill-health' if drill_ip else 'standby-health'
          request = urllib.request.Request('https://standby.mangahub.art/internal/' + path, headers={
              'X-MangaHub-Origin-Secret': os.environ['STANDBY_ORIGIN_SECRET'],
              'X-MangaHub-Public-Host': 'api.mangahub.art'})
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 200 and json.load(response)['status'] == 'ready'
          PY
      - name: Configure routes
        if: '!inputs.inspect_only'
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path('cloudflare/wrangler-standby.toml')
          text = p.read_text()
          # Pausing failover retains the frontend country policy and passes through
          # to Vercel. Only the separate source Worker keeps more-specific routes.
          routes = 'routes = [' + ','.join('{ pattern = "' + host + '/*", zone_name = "mangahub.art" }' for host in ['mangahub.art', 'api.mangahub.art', 'auth.mangahub.art']) + ']'
          text = text.replace('routes = []', routes, 1)
          if os.environ['ACTIVATE'] == 'true':
              text = text.replace('FAILOVER_ENABLED = \"false\"', 'FAILOVER_ENABLED = \"true\"')
          drill_ip = os.environ.get('DRILL_CLIENT_IP', '').strip()
          if drill_ip:
              text = text.replace('DRILL_CLIENT_IP = ""', 'DRILL_CLIENT_IP = ' + json.dumps(drill_ip))
              deadline = str(int(time.time()) + 3600)
              text = text.replace('DRILL_EXPIRES_AT = "0"', 'DRILL_EXPIRES_AT = ' + json.dumps(deadline))
              print('Single-client drill expires at Unix time ' + deadline)
          p.write_text(text)
          PY
      - name: Deploy router with its private origin secret
        if: '!inputs.inspect_only'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STANDBY_ORIGIN_SECRET"
          # First deployment stays detached. Subsequent activation reuses the installed secret.
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/standby-worker-secrets.json').write_text(json.dumps({'STANDBY_ORIGIN_SECRET': os.environ['STANDBY_ORIGIN_SECRET']}))
          PY
          # The router includes the existing frontend country gate. Wrangler cannot
          # take over a route owned by that separate Worker, so transfer only that
          # exact known route; leave every more-specific source route untouched.
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          def api(path, data=None):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4/' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'},
                  method='GET' if data is None else 'PUT')
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              assert value['success']
              return value['result']
          zone = api('zones?name=mangahub.art')[0]['id']
          previous = api('zones/' + zone + '/workers/routes')
          Path('/tmp/standby-previous-routes.json').write_text(json.dumps({'zone': zone, 'routes': previous}))
          for route in previous:
              if route['pattern'] == 'mangahub.art/*' and route.get('script') == 'mangahub-vn-only':
                  api('zones/' + zone + '/workers/routes/' + route['id'], {'pattern': route['pattern'], 'script': 'mangahub-standby-router'})
                  print('Transferred frontend route; country gate is retained in standby router')
          PY
          if ! npx --yes wrangler@4 deploy --config cloudflare/wrangler-standby.toml; then
            python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          previous = json.loads(Path('/tmp/standby-previous-routes.json').read_text())
          for route in previous['routes']:
              if route['pattern'] == 'mangahub.art/*' and route.get('script') == 'mangahub-vn-only':
                  request = urllib.request.Request('https://api.cloudflare.com/client/v4/zones/' + previous['zone'] + '/workers/routes/' + route['id'],
                      data=json.dumps({'pattern': route['pattern'], 'script': route['script']}).encode(), method='PUT',
                      headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      assert json.load(response)['success']
          PY
            exit 1
          fi
          npx --yes wrangler@4 secret bulk /tmp/standby-worker-secrets.json --config cloudflare/wrangler-standby.toml
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          previous = json.loads(Path('/tmp/standby-previous-routes.json').read_text())
          request = urllib.request.Request('https://api.cloudflare.com/client/v4/zones/' + previous['zone'] + '/workers/routes',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              current = {route['pattern']: route.get('script') for route in json.load(response)['result']}
          targets = {host + '/*' for host in ['mangahub.art', 'api.mangahub.art', 'auth.mangahub.art']}
          for route in previous['routes']:
              if route['pattern'] not in targets:
                  assert current.get(route['pattern']) == route.get('script'), 'Unrelated source route changed'
          assert all(current.get(pattern) == 'mangahub-standby-router' for pattern in targets)
          print('All public router bindings verified; more-specific source routes unchanged')
          PY
