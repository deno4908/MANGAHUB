name: Verify standby Nginx navigation

on:
  push:
    branches: [main]
    paths:
      - deploy/standby/nginx.conf.template
      - deploy/standby/test_nginx_navigation.py
      - deploy/standby/nginx-api-auth.conf.template
      - deploy/standby/test_nginx_api_auth.py
      - .github/workflows/nginx-navigation.yml
  pull_request:
    paths:
      - deploy/standby/nginx.conf.template
      - deploy/standby/test_nginx_navigation.py
      - deploy/standby/nginx-api-auth.conf.template
      - deploy/standby/test_nginx_api_auth.py
      - .github/workflows/nginx-navigation.yml

permissions:
  contents: read

jobs:
  verify-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nginx for isolated loopback tests
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y nginx
          fi
      - name: Verify HTML handoff, API writes and origin access gates
        run: python3 -m unittest discover -s deploy/standby -p 'test_nginx_*.py'
