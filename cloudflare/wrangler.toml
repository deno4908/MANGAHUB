name = "mangahub-mangadex-edge"
main = "mangadex-edge-worker.js"
compatibility_date = "2026-06-10"
workers_dev = true

routes = [
  { pattern = "mangahub.art/api/mangadex-edge/*", zone_name = "mangahub.art" }
]

# Same-zone fetches bypass Worker routes. Use the service binding so source
# access checks also survive a primary API outage without relaxing the policy.
[[services]]
binding = "ACCESS_ROUTER"
service = "mangahub-standby-router"

# Keep source execution near Singapore. Cache API data is still regional;
# signed source handoffs carry a successful reader fetch to the backend.
[placement]
region = "aws:ap-southeast-1"
