name = "mangahub-standby-router"
main = "standby-worker.js"
compatibility_date = "2026-11-11"
workers_dev = false
# Activate routes only after standby health and the failure drill pass.
# Keep the existing more-specific /api/mangadex-edge/* route intact.
routes = []
# routes = [
#   { pattern = "mangahub.art/*", zone_name = "mangahub.art" },
#   { pattern = "api.mangahub.art/*", zone_name = "mangahub.art" },
#   { pattern = "auth.mangahub.art/*", zone_name = "mangahub.art" },
# ]
[vars]
FAILOVER_ENABLED = "false"
MONITOR_ONLY = "false"
BACKUP_ORIGIN = "https://standby.mangahub.art"
DRILL_CLIENT_IP = ""
DRILL_EXPIRES_AT = "0"
[triggers]
crons = ["* * * * *"]
# Supply STANDBY_ORIGIN_SECRET with wrangler secret put, never in this file.
