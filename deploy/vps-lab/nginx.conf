log_format mh_lab_timing '$time_iso8601 method=$request_method path=$uri status=$status bytes=$body_bytes_sent seconds=$request_time upstream_seconds=$upstream_response_time header_seconds=$upstream_header_time cache=$sent_http_x_cache';
map $http_cf_connecting_ip $mh_lab_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
server {
    listen 8443 ssl;
    server_name standby.mangahub.art;
    server_tokens off;
    access_log /var/log/nginx/mangahub-lab-access.log mh_lab_timing;
    include /etc/nginx/mangahub-origin-rules/*.conf;
    ssl_certificate /etc/letsencrypt/live/standby.mangahub.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/standby.mangahub.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/mangahub/lab/dist;
    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ {
        if ($http_cf_ipcountry != "VN") { return 403; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    # OAuth returns to the React page; only the other /auth/ paths are APIs.
    location = /auth/callback {
        if ($http_cf_ipcountry != "VN") { return 403; }
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    location ~ ^/(api/|auth/|health$) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host "standby.mangahub.art:8443";
        proxy_set_header X-Forwarded-Host "standby.mangahub.art:8443";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $mh_lab_client_ip;
        proxy_set_header X-Real-IP $mh_lab_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_hide_header X-MangaHub-Origin;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
    }
    location / {
        if ($http_cf_ipcountry != "VN") { return 403; }
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
