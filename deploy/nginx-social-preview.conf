# MangaHub social preview for SPA manga routes.
# Put the "map" block in nginx http context, then merge the "location"
# blocks into the mangahub.art server block.

map $http_user_agent $mangahub_social_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|messenger|zalo|twitterbot|telegrambot|discordbot|whatsapp|linkedinbot|pinterest|skypeuripreview|slackbot|embedly|quora\ link\ preview|vkshare|crawler|spider) 1;
}

server {
    # Keep your existing listen/server_name/ssl/root settings.

    location ~ ^/manga/(.+)$ {
        if ($mangahub_social_preview_bot) {
            rewrite ^/manga/(.+)$ /api/manga/share/$1 last;
        }

        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
