# MangaHub social preview for SPA manga routes.
#
# Why this is needed:
# - /manga/{id} is a Vite/React SPA route, so crawlers normally receive the
#   generic index.html meta tags.
# - /api/manga/share/{id} renders per-manga OpenGraph/Twitter tags for chat apps.
# - /api/manga/seo/{id} renders clean indexable HTML for search crawlers.
# - These nginx rules send only crawlers to server-rendered HTML, while normal
#   users still receive the SPA.
#
# Install:
# 1. Put the "map" block below inside nginx http { ... }, usually:
#    /etc/nginx/nginx.conf
# 2. Put the "server location" blocks inside your mangahub.art server block,
#    usually /etc/nginx/sites-available/mangahub or /etc/nginx/conf.d/*.conf.
# 3. Run:
#    sudo nginx -t
#    sudo systemctl reload nginx
# 4. Verify:
#    curl -A "facebookexternalhit/1.1" https://mangahub.art/manga/<id> | grep -E "og:title|og:image|twitter:title"
#    curl -A "Googlebot/2.1 (+http://www.google.com/bot.html)" https://mangahub.art/manga/<id> | grep -E "<title>|canonical|og:title|og:image"

map $http_user_agent $mangahub_social_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|facebookcatalog|messenger|zalo|zalobot|twitterbot|telegrambot|discordbot|whatsapp|linkedinbot|pinterest|skypeuripreview|slackbot|embedly|quora\ link\ preview|vkshare|line|kakaotalk|redditbot) 1;
}

map $http_user_agent $mangahub_search_preview_bot {
    default 0;
    ~*(googlebot|bingbot|duckduckbot|yandexbot|baiduspider|slurp) 1;
}

server {
    # Keep your existing listen/server_name/ssl/root settings.

    # Serve SEO files from Vite dist/public normally.
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location ~ ^/manga/(.+)$ {
        if ($mangahub_search_preview_bot) {
            rewrite ^/manga/(.+)$ /api/manga/seo/$1 last;
        }

        if ($mangahub_social_preview_bot) {
            rewrite ^/manga/(.+)$ /api/manga/share/$1 last;
        }

        add_header Cache-Control "no-store, max-age=0" always;
        add_header Vary "Sec-Purpose, Purpose, Sec-Fetch-Dest" always;
        try_files $uri /index.html;
    }

    location / {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Vary "Sec-Purpose, Purpose, Sec-Fetch-Dest" always;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
